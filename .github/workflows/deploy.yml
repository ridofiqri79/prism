name: Deploy to VPS

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy.yml
      - docker-compose.yml
      - .env.example
      - prism-backend/**
      - prism-frontend/**

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/ridofiqri79/prism-backend
  FRONTEND_IMAGE: ghcr.io/ridofiqri79/prism-frontend

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed runtime areas
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          before="${{ github.event.before }}"
          after="${{ github.sha }}"
          zero_sha="0000000000000000000000000000000000000000"

          if [ -z "${before}" ] || [ "${before}" = "${zero_sha}" ] || ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
            changed_files="$(printf '%s\n' 'docker-compose.yml' 'prism-backend/Dockerfile' 'prism-frontend/Dockerfile')"
          else
            changed_files="$(git diff --name-only "${before}" "${after}" || true)"
          fi

          echo "=== Changed files ==="
          if [ -n "${changed_files}" ]; then
            printf '%s\n' "${changed_files}"
          else
            echo "No changed files detected; forcing full deploy."
            changed_files="$(printf '%s\n' 'docker-compose.yml' 'prism-backend/Dockerfile' 'prism-frontend/Dockerfile')"
          fi

          backend_changed=false
          frontend_changed=false
          migrate_changed=false
          infra_changed=false

          while IFS= read -r file; do
            [ -z "${file}" ] && continue
            case "${file}" in
              docker-compose.yml|.github/workflows/deploy.yml|.env.example)
                infra_changed=true
                backend_changed=true
                frontend_changed=true
                migrate_changed=true
                ;;
              prism-backend/migrations/*)
                migrate_changed=true
                ;;
              prism-backend/*)
                backend_changed=true
                ;;
              prism-frontend/*)
                frontend_changed=true
                ;;
            esac
          done <<< "${changed_files}"

          should_deploy=false
          needs_build=false

          if [ "${backend_changed}" = true ] || [ "${frontend_changed}" = true ] || [ "${migrate_changed}" = true ] || [ "${infra_changed}" = true ]; then
            should_deploy=true
          fi

          if [ "${backend_changed}" = true ] || [ "${frontend_changed}" = true ]; then
            needs_build=true
          fi

          {
            echo "changed_files<<EOF"
            printf '%s\n' "${changed_files}"
            echo "EOF"
            echo "backend_changed=${backend_changed}"
            echo "frontend_changed=${frontend_changed}"
            echo "migrate_changed=${migrate_changed}"
            echo "infra_changed=${infra_changed}"
            echo "should_deploy=${should_deploy}"
            echo "needs_build=${needs_build}"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        if: steps.changes.outputs.needs_build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.changes.outputs.needs_build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        if: steps.changes.outputs.backend_changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./prism-backend
          file: ./prism-backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:main
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=prism-backend
          cache-to: type=gha,mode=max,scope=prism-backend

      - name: Build and push frontend image
        if: steps.changes.outputs.frontend_changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./prism-frontend
          file: ./prism-frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:main
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
            VITE_APP_NAME=${{ secrets.VITE_APP_NAME }}
          cache-from: type=gha,scope=prism-frontend
          cache-to: type=gha,mode=max,scope=prism-frontend

      - name: Deploy to VPS
        if: steps.changes.outputs.should_deploy == 'true'
        uses: appleboy/ssh-action@v1.0.3
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN: ${{ secrets.JWT_EXPIRES_IN }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_APP_NAME: ${{ secrets.VITE_APP_NAME }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          BACKEND_IMAGE_REF: ${{ env.BACKEND_IMAGE }}:main
          FRONTEND_IMAGE_REF: ${{ env.FRONTEND_IMAGE }}:main
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BACKEND_CHANGED: ${{ steps.changes.outputs.backend_changed }}
          FRONTEND_CHANGED: ${{ steps.changes.outputs.frontend_changed }}
          MIGRATE_CHANGED: ${{ steps.changes.outputs.migrate_changed }}
          INFRA_CHANGED: ${{ steps.changes.outputs.infra_changed }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB,JWT_SECRET,JWT_EXPIRES_IN,VITE_API_BASE_URL,VITE_APP_NAME,CLOUDFLARE_TUNNEL_TOKEN,BACKEND_IMAGE_REF,FRONTEND_IMAGE_REF,GHCR_USER,GHCR_TOKEN,BACKEND_CHANGED,FRONTEND_CHANGED,MIGRATE_CHANGED,INFRA_CHANGED
          script: |
            set -euo pipefail
            export PATH=$PATH:/usr/bin:/usr/local/bin
            cd /home/prism.admin/prism

            git fetch origin main:refs/remotes/origin/main
            target_sha="$(git rev-parse origin/main)"
            git checkout -f main
            git reset --hard "${target_sha}"

            # Generate .env
            echo "POSTGRES_USER=${POSTGRES_USER}" > .env
            echo "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}" >> .env
            echo "POSTGRES_DB=${POSTGRES_DB}" >> .env
            echo "BACKEND_IMAGE=${BACKEND_IMAGE_REF}" >> .env
            echo "FRONTEND_IMAGE=${FRONTEND_IMAGE_REF}" >> .env
            echo "PORT=8080" >> .env
            echo "ENV=production" >> .env
            echo "DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable" >> .env
            echo "JWT_SECRET=${JWT_SECRET}" >> .env
            echo "JWT_EXPIRES_IN=${JWT_EXPIRES_IN}" >> .env
            echo "VITE_API_BASE_URL=${VITE_API_BASE_URL}" >> .env
            echo "VITE_APP_NAME=${VITE_APP_NAME}" >> .env
            echo "CLOUDFLARE_TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}" >> .env

            # Verifikasi aman
            echo "=== Verifikasi .env ==="
            for var in POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB JWT_SECRET VITE_API_BASE_URL CLOUDFLARE_TUNNEL_TOKEN BACKEND_IMAGE FRONTEND_IMAGE; do
              val=$(grep "^${var}=" .env | cut -d'=' -f2-)
              if [ -z "$val" ]; then
                echo "ERROR: ${var} kosong!"
                exit 1
              else
                echo "OK: ${var} terisi"
              fi
            done

            if [ "${BACKEND_CHANGED}" = true ] || [ "${FRONTEND_CHANGED}" = true ]; then
              echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
            fi

            if [ "${BACKEND_CHANGED}" = true ] || [ "${MIGRATE_CHANGED}" = true ] || [ "${INFRA_CHANGED}" = true ]; then
              docker compose up -d postgres

              echo "Menunggu postgres ready..."
              until docker compose exec postgres pg_isready -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" 2>/dev/null; do
                sleep 2
              done
              echo "OK: Postgres ready"

              echo "Menjalankan migrasi..."
              docker compose run --rm migrate
              echo "OK: Migrasi selesai"
            fi

            if [ "${BACKEND_CHANGED}" = true ]; then
              echo "Pull dan restart backend..."
              docker compose pull backend
              docker compose up -d --no-deps backend
            fi

            if [ "${FRONTEND_CHANGED}" = true ]; then
              echo "Pull dan restart frontend..."
              docker compose pull frontend
              docker compose up -d --no-deps frontend
            fi

            docker compose --profile tunnel up -d cloudflared

            if [ "${BACKEND_CHANGED}" = true ] || [ "${FRONTEND_CHANGED}" = true ]; then
              docker logout ghcr.io
            fi

            # Verifikasi container jalan
            echo "=== Status Container ==="
            docker compose --profile tunnel ps

            # Cleanup image lama
            docker image prune -f

            echo "Deploy selesai."
