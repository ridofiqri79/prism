name: Deploy to VPS

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy.yml
      - docker-compose.yml
      - .env.example
      - prism-backend/**
      - prism-frontend/**

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN: ${{ secrets.JWT_EXPIRES_IN }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_APP_NAME: ${{ secrets.VITE_APP_NAME }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB,JWT_SECRET,JWT_EXPIRES_IN,VITE_API_BASE_URL,VITE_APP_NAME,CLOUDFLARE_TUNNEL_TOKEN
          script: |
            set -euo pipefail
            export PATH=$PATH:/usr/bin:/usr/local/bin
            cd /home/prism.admin/prism

            current_sha="$(git rev-parse HEAD 2>/dev/null || true)"
            git fetch origin main:refs/remotes/origin/main
            target_sha="$(git rev-parse origin/main)"

            if [ -n "${current_sha}" ] && [ "${current_sha}" = "${target_sha}" ]; then
              echo "Repository already at ${target_sha}; no deploy needed."
              exit 0
            fi

            if [ -n "${current_sha}" ] && git cat-file -e "${current_sha}^{commit}" 2>/dev/null; then
              changed_files="$(git diff --name-only "${current_sha}" "${target_sha}" || true)"
            else
              changed_files="$(printf '%s\n' 'docker-compose.yml' 'prism-backend/Dockerfile' 'prism-frontend/Dockerfile')"
            fi

            echo "=== Changed files ==="
            if [ -n "${changed_files}" ]; then
              printf '%s\n' "${changed_files}"
            else
              echo "No changed files detected; forcing full deploy."
              changed_files="$(printf '%s\n' 'docker-compose.yml' 'prism-backend/Dockerfile' 'prism-frontend/Dockerfile')"
            fi

            backend_changed=false
            frontend_changed=false
            migrate_changed=false
            infra_changed=false

            while IFS= read -r file; do
              [ -z "${file}" ] && continue
              case "${file}" in
                docker-compose.yml|.github/workflows/deploy.yml|.env.example)
                  infra_changed=true
                  backend_changed=true
                  frontend_changed=true
                  migrate_changed=true
                  ;;
                prism-backend/migrations/*)
                  migrate_changed=true
                  ;;
                prism-backend/*)
                  backend_changed=true
                  ;;
                prism-frontend/*)
                  frontend_changed=true
                  ;;
              esac
            done <<EOF_CHANGED
            ${changed_files}
            EOF_CHANGED

            git checkout -f main
            git reset --hard "${target_sha}"

            if [ "${backend_changed}" = false ] && [ "${frontend_changed}" = false ] && [ "${migrate_changed}" = false ] && [ "${infra_changed}" = false ]; then
              echo "Only non-runtime files changed; repository updated without container rebuild."
              exit 0
            fi

            # Generate .env
            echo "POSTGRES_USER=${POSTGRES_USER}" > .env
            echo "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}" >> .env
            echo "POSTGRES_DB=${POSTGRES_DB}" >> .env
            echo "PORT=8080" >> .env
            echo "ENV=production" >> .env
            echo "DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable" >> .env
            echo "JWT_SECRET=${JWT_SECRET}" >> .env
            echo "JWT_EXPIRES_IN=${JWT_EXPIRES_IN}" >> .env
            echo "VITE_API_BASE_URL=${VITE_API_BASE_URL}" >> .env
            echo "VITE_APP_NAME=${VITE_APP_NAME}" >> .env
            echo "CLOUDFLARE_TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}" >> .env

            # Verifikasi aman
            echo "=== Verifikasi .env ==="
            for var in POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB JWT_SECRET VITE_API_BASE_URL CLOUDFLARE_TUNNEL_TOKEN; do
              val=$(grep "^${var}=" .env | cut -d'=' -f2)
              if [ -z "$val" ]; then
                echo "ERROR: ${var} kosong!"
                exit 1
              else
                echo "OK: ${var} terisi"
              fi
            done

            if [ "${backend_changed}" = true ] || [ "${migrate_changed}" = true ] || [ "${infra_changed}" = true ]; then
              docker compose up -d postgres

              echo "Menunggu postgres ready..."
              until docker compose exec postgres pg_isready -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" 2>/dev/null; do
                sleep 2
              done
              echo "OK: Postgres ready"

              echo "Menjalankan migrasi..."
              docker compose run --rm migrate
              echo "OK: Migrasi selesai"
            fi

            if [ "${backend_changed}" = true ]; then
              echo "Build dan restart backend..."
              docker compose --profile tunnel build --pull backend
              docker compose --profile tunnel up -d --no-deps backend
            fi

            if [ "${frontend_changed}" = true ]; then
              echo "Build dan restart frontend..."
              docker compose --profile tunnel build --pull frontend
              docker compose --profile tunnel up -d --no-deps frontend
            fi

            docker compose --profile tunnel up -d cloudflared

            # Verifikasi container jalan
            echo "=== Status Container ==="
            docker compose --profile tunnel ps

            # Cleanup image lama
            docker image prune -f

            echo "Deploy selesai."
